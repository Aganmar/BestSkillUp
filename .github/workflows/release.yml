# Builds a WowUp-compatible release, either when a version tag (v1.2.3) is pushed
# or from the Actions tab ("Run workflow"), which tags the current commit with
# v<TOC ## Version>:
#   BestSkillUp-<tag>-forever.zip  (BestSkillUp/ folder at the zip root, add-on files only)
#   release.json                   (BigWigs packager format, flavor "forever")
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        run: |
          toc=$(grep -m1 '^## Version:' BestSkillUp.toc | sed 's/^## Version:[[:space:]]*//' | tr -d '\r')
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "v$toc" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match TOC version $toc"; exit 1
            fi
          fi
          echo "VERSION=v$toc" >> "$GITHUB_ENV"

      - name: Build zip and release.json
        run: |
          V="$VERSION"
          Z="BestSkillUp-$V-forever.zip"
          IFACE=$(grep -m1 '^## Interface:' BestSkillUp.toc | sed 's/^## Interface:[[:space:]]*//' | cut -d, -f1 | tr -d ' \r')
          # Add-on files = the TOC, every file it loads, the in-game icon and the licence (dev files such as Tools/ stay out).
          # Dev*.lua files are for local testing only: left out of the zip and of its TOC (the Dev/ add-ons are never in the TOC).
          files=$(grep -v '^#' BestSkillUp.toc | tr -d '\r' | sed '/^[[:space:]]*$/d' | grep -v '^Dev')
          mkdir -p build
          git archive --format=tar --prefix=BestSkillUp/ HEAD $files Media/BestSkillUp.tga LICENSE | tar -x -C build
          grep -v '^Dev' BestSkillUp.toc > build/BestSkillUp/BestSkillUp.toc
          (cd build && zip -qrX "../$Z" BestSkillUp)
          cat > release.json <<EOF
          {
            "releases": [
              {
                "name": "BestSkillUp",
                "version": "$V",
                "filename": "$Z",
                "nolib": false,
                "metadata": [
                  { "flavor": "forever", "interface": $IFACE }
                ]
              }
            ]
          }
          EOF
          python3 -m json.tool release.json
          unzip -l "$Z"
          echo "ZIP=$Z" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" "$ZIP" release.json --target "$GITHUB_SHA" \
            --title "BestSkillUp $VERSION" --generate-notes
